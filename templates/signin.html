<body>

  <script>
    const API_BASE = "/vocab/api";
    
    let csrfToken = null;
    
    async function getCsrfToken() {
      if (csrfToken) return csrfToken;
      
      try {
        const response = await fetchWithTimeout(API_BASE + '/csrf_token', {
          method: 'GET',
          credentials: 'include'
        }, 5000);
        
        const data = await response.json();
        csrfToken = data.csrf_token;
        return csrfToken;
      } catch (err) {
        return null;
      }
    }
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }
    
    function safeLocalStorageSet(key, value) {
      try {
        if (typeof(Storage) !== "undefined") {
          localStorage.setItem(key, value);
          const readBack = localStorage.getItem(key);
          if (readBack === value) {
            return true;
          }
        }
      } catch (e) {
        return setCookieBackup(key, value);
      }
      return false;
    }
    
    function safeLocalStorageGet(key) {
      try {
        if (typeof(Storage) !== "undefined") {
          const value = localStorage.getItem(key);
          if (value !== null) {
            return value;
          }
        }
      } catch (e) {
        // 静默处理
      }
      return getCookieBackup(key);
    }
    
    function safeLocalStorageRemove(key) {
      try {
        if (typeof(Storage) !== "undefined") {
          localStorage.removeItem(key);
          return true;
        }
      } catch (e) {
        // 静默处理
      }
      removeCookieBackup(key);
      return false;
    }
    
    function setCookieBackup(key, value) {
      try {
        const expires = new Date();
        expires.setTime(expires.getTime() + (365 * 24 * 60 * 60 * 1000));
        
        const cookieConfigs = [
          `vocab_${key}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/;SameSite=Lax`,
          `vocab_${key}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/vocab/;SameSite=Lax`,
          `vocab_${key}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/vocab/signin;SameSite=Lax`,
          `vocab_persist_${key}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/;SameSite=Lax;Secure=false`
        ];
        
        cookieConfigs.forEach(config => {
          document.cookie = config;
        });
        
        return true;
      } catch (e) {
        return false;
      }
    }
    
    function getCookieBackup(key) {
      try {
        const cookiePatterns = [`vocab_${key}=`, `vocab_persist_${key}=`];
        
        for (const nameEQ of cookiePatterns) {
          const ca = document.cookie.split(';');
          for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) {
              const value = decodeURIComponent(c.substring(nameEQ.length, c.length));
              return value;
            }
          }
        }
        
        return null;
      } catch (e) {
        return null;
      }
    }
    
    function removeCookieBackup(key) {
      try {
        const cookiePatterns = [`vocab_${key}`, `vocab_persist_${key}`];
        const paths = ['/', '/vocab/', '/vocab/signin'];
        
        cookiePatterns.forEach(cookieName => {
          paths.forEach(path => {
            document.cookie = `${cookieName}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=${path}`;
          });
        });
      } catch (e) {
        // 静默处理
      }
    }
    
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    
    function isPrivateMode() {
      return new Promise((resolve) => {
        try {
          const testKey = '_test_private_mode';
          localStorage.setItem(testKey, 'test');
          localStorage.removeItem(testKey);
          resolve(false);
        } catch (e) {
          resolve(true);
        }
      });
    }
    
    function multiLevelGet(key) {
      let value = null;
      
      value = safeLocalStorageGet(key);
      if (value) {
        return value;
      }
      
      try {
        value = localStorage.getItem(`vocab_${key}`);
        if (value) {
          safeLocalStorageSet(key, value);
          return value;
        }
      } catch (e) {
        // 静默处理
      }
      
      try {
        value = sessionStorage.getItem(`vocab_${key}`);
        if (value) {
          safeLocalStorageSet(key, value);
          return value;
        }
      } catch (e) {
        // 静默处理
      }
      
      value = getCookieBackup(key);
      if (value) {
        safeLocalStorageSet(key, value);
        return value;
      }
      
      try {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.includes(key) && cookie.includes('=')) {
            const [cookieName, cookieValue] = cookie.split('=');
            if (cookieName.includes(key) && cookieValue) {
              value = decodeURIComponent(cookieValue);
              safeLocalStorageSet(key, value);
              setCookieBackup(key, value);
              return value;
            }
          }
        }
      } catch (e) {
        // 静默处理
      }
      
      return null;
    }
    
    function multiLevelSet(key, value) {
      let success = false;
      
      if (safeLocalStorageSet(key, value)) {
        success = true;
      }
      
      try {
        sessionStorage.setItem(`vocab_${key}`, value);
      } catch (e) {
        // 静默处理
      }
      
      if (setCookieBackup(key, value)) {
        success = true;
      }
      
      return success;
    }
    
    function multiLevelRemove(key) {
      safeLocalStorageRemove(key);
      
      try {
        sessionStorage.removeItem(`vocab_${key}`);
      } catch (e) {
        // 静默处理
      }
      
      removeCookieBackup(key);
    }
    
    async function getServerRememberedLogin() {
      try {
        const response = await fetch('/vocab/api/get_remembered_login', {
          method: 'GET',
          credentials: 'include'
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.ok && data.has_data) {
            return {
              username: data.username,
              password: data.password,
              hasData: true,
              deviceFingerprint: data.device_fingerprint
            };
          } else {
            return {
              hasData: false,
              deviceFingerprint: data.device_fingerprint
            };
          }
        }
      } catch (error) {
        // 静默处理
      }
      return { hasData: false };
    }
    
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showToast('请输入用户名和密码', 'error'); return; }
      const button = document.querySelector('button[onclick="login()"]');
      const label = button.textContent;
      button.disabled = true;
      button.textContent = '🔄 登录中...';
      try {
        const response = await fetch(API_BASE + '/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        if (response.ok) {
          multiLevelRemove('remembered_password');
          if (document.getElementById('remember-login').checked) {
            multiLevelSet('remembered_username', username);
            multiLevelSet('remember_login', 'true');
          } else {
            multiLevelRemove('remembered_username');
            multiLevelRemove('remember_login');
          }
          showToast('登录成功！');
          setTimeout(() => { window.location.href = '/vocab/app'; }, 1000);
        } else {
          const error = await response.json();
          showToast('登录失败：' + (error.message || '请检查用户名和密码'), 'error');
        }
      } catch (error) {
        showToast('登录失败：网络连接异常', 'error');
      } finally {
        button.disabled = false;
        button.textContent = label;
      }
    }

    async function register() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showToast('请输入用户名和密码', 'error'); return; }
      const button = document.querySelector('button[onclick="register()"]');
      const label = button.textContent;
      button.disabled = true;
      button.textContent = '🔄 注册中...';
      try {
        const response = await fetch(API_BASE + '/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        if (response.ok) {
          multiLevelRemove('remembered_password');
          if (document.getElementById('remember-login').checked) {
            multiLevelSet('remembered_username', username);
            multiLevelSet('remember_login', 'true');
          } else {
            multiLevelRemove('remembered_username');
            multiLevelRemove('remember_login');
          }
          showToast('注册成功！');
          setTimeout(() => { window.location.href = '/vocab/app'; }, 1000);
        } else {
          const error = await response.json();
          showToast('注册失败：' + (error.message || '用户名可能已存在'), 'error');
        }
      } catch (error) {
        showToast('注册失败：网络连接异常', 'error');
      } finally {
        button.disabled = false;
        button.textContent = label;
      }
    }
    document.getElementById('login-form').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });
    
    document.addEventListener('DOMContentLoaded', function() {
      // Remove credentials written by older versions; keep only the optional username.
      multiLevelRemove('remembered_password');
      const username = multiLevelGet('remembered_username');
      const remembered = multiLevelGet('remember_login') === 'true';
      if (remembered && username) {
        document.getElementById('username').value = username;
        document.getElementById('remember-login').checked = true;
      }
    });

    function saveDataOnUnload() {
      multiLevelRemove('remembered_password');
      if (document.getElementById('remember-login').checked) {
        const username = document.getElementById('username').value.trim();
        if (username) {
          multiLevelSet('remembered_username', username);
          multiLevelSet('remember_login', 'true');
        }
      }
    }

    window.addEventListener('beforeunload', saveDataOnUnload);
    window.addEventListener('pagehide', saveDataOnUnload);
    window.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') saveDataOnUnload();
    });
    // 移动端复选框触摸事件修复 - 增强版
    let mobileHandlers = null;
    
    function setupMobileCheckboxFix() {
      const checkbox = document.getElementById('remember-login');
      const label = document.querySelector('.checkbox-label');
      
      if (!checkbox || !label) {
        console.log('Checkbox or label not found, retrying...');
        return false;
      }
      
      // 清理之前的事件监听器
      if (mobileHandlers) {
        try {
          label.removeEventListener('touchstart', mobileHandlers.labelTouch);
          label.removeEventListener('click', mobileHandlers.labelClick);
          label.removeEventListener('touchend', mobileHandlers.labelTouchEnd);
          checkbox.removeEventListener('touchstart', mobileHandlers.checkboxTouch);
          checkbox.removeEventListener('change', mobileHandlers.checkboxChange);
        } catch (e) {
          console.log('Error removing old handlers:', e);
        }
      }
      
      // 创建事件处理器
      mobileHandlers = {
        labelClick: function(e) {
          console.log('Label clicked');
          e.preventDefault();
          e.stopPropagation();
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event('change', { bubbles: true }));
        },
        
        labelTouch: function(e) {
          console.log('Label touched');
          e.preventDefault();
          e.stopPropagation();
          this.style.opacity = '0.7';
          
          // 延时切换状态，避免与原生行为冲突
          setTimeout(() => {
            checkbox.checked = !checkbox.checked;
            checkbox.dispatchEvent(new Event('change', { bubbles: true }));
          }, 50);
        },
        
        labelTouchEnd: function(e) {
          console.log('Label touch ended');
          setTimeout(() => {
            this.style.opacity = '1';
          }, 100);
        },
        
        checkboxTouch: function(e) {
          console.log('Checkbox touched');
          e.stopPropagation();
          // 让原生事件处理
        },
        
        checkboxChange: function(e) {
          console.log('Checkbox changed:', this.checked);
        }
      };
      
      // 添加事件监听器
      try {
        label.addEventListener('touchstart', mobileHandlers.labelTouch, { passive: false });
        label.addEventListener('touchend', mobileHandlers.labelTouchEnd, { passive: false });
        label.addEventListener('click', mobileHandlers.labelClick);
        checkbox.addEventListener('touchstart', mobileHandlers.checkboxTouch, { passive: false });
        checkbox.addEventListener('change', mobileHandlers.checkboxChange);
        
        // 移动端样式优化
        if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
          label.style.webkitTouchCallout = 'none';
          label.style.webkitUserSelect = 'none';
          label.style.userSelect = 'none';
          label.style.webkitTapHighlightColor = 'transparent';
          
          // 增加触摸区域
          label.style.minHeight = '44px';
          label.style.display = 'flex';
          label.style.alignItems = 'center';
          
          // 复选框样式调整
          checkbox.style.minWidth = '20px';
          checkbox.style.minHeight = '20px';
          checkbox.style.cursor = 'pointer';
        }
        
        console.log('Mobile checkbox fix applied successfully');
        return true;
      } catch (e) {
        console.error('Error setting up mobile checkbox fix:', e);
        return false;
      }
    }
    
    // 页面加载完成后设置 - 增强版多次重试
    document.addEventListener('DOMContentLoaded', function() {
      let attempts = 0;
      const maxAttempts = 10;
      
      function trySetupMobileCheckbox() {
        attempts++;
        console.log(`Attempting mobile checkbox setup, attempt ${attempts}`);
        
        if (setupMobileCheckboxFix()) {
          console.log('Mobile checkbox setup successful');
          return;
        }
        
        if (attempts < maxAttempts) {
          console.log(`Setup failed, retrying in ${attempts * 100}ms...`);
          setTimeout(trySetupMobileCheckbox, attempts * 100);
        } else {
          console.error('Failed to setup mobile checkbox after', maxAttempts, 'attempts');
        }
      }
      
      // 立即尝试一次
      trySetupMobileCheckbox();
    });
    
    // 额外的兜底方案
    window.addEventListener('load', function() {
      setTimeout(() => {
        if (!mobileHandlers) {
          console.log('Fallback mobile checkbox setup');
          setupMobileCheckboxFix();
        }
      }, 1000);
    });
    
    // 页面显示时重新设置（处理从后台切回的情况）
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        setTimeout(() => {
          setupMobileCheckboxFix();
        }, 200);
      }
    });
  </script>
</body>
